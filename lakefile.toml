name = "parametricity"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Parametricity"]
testDriver = "test"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "Parametricity"

[[lean_exe]]
name = "elab"
root = "Parametricity"

[[lean_exe]]
name = "test"
root = "Parametricity.TestRunner"
